<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="line-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#f43f5e" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".3"/></linearGradient><style>@keyframes draw{0%{stroke-dashoffset:1000}}@keyframes pulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}.subtitle,.tag,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:52px;fill:url(#text-grad)}.subtitle{font-weight:400;font-size:22px;fill:#cbd5e1}.tag{font-weight:600;font-size:14px;fill:#38bdf8;letter-spacing:1.5px}.drift-line{fill:none;stroke:url(#line-grad);stroke-width:4;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 4s ease-in-out infinite alternate}.ref-line{fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:6 6}.alert-pulse{animation:pulse 2s ease-in-out infinite}</style></defs><rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/><g opacity=".4" transform="translate(0, 50)"><path d="M 100 200 Q 300 200, 500 200 T 900 200 T 1100 200" class="ref-line"/><path d="M 100 200 Q 300 180, 500 230 T 750 110 T 950 80 T 1100 60" class="drift-line"/><circle cx="750" cy="110" r="8" fill="#f43f5e" class="alert-pulse" style="transform-origin:750px 110px"/><circle cx="950" cy="80" r="10" fill="#f43f5e" class="alert-pulse" style="transform-origin:950px 80px"/><circle cx="200" cy="150" r="2" fill="#38bdf8" opa