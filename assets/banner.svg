<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 22px; fill: #cbd5e1; }
      .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 1.5px; }
      .drift-line { fill: none; stroke: url(#line-grad); stroke-width: 4; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4s ease-in-out infinite alternate; }
      .ref-line { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; }
      .alert-pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes draw {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Drift Visualization Lines in Background -->
  <g opacity="0.4" transform="translate(0, 50)">
    <!-- Reference Line -->
    <path d="M 100 200 Q 300 200, 500 200 T 900 200 T 1100 200" class="ref-line" />
    
    <!-- Drift Curve -->
    <path d="M 100 200 Q 300 180, 500 230 T 750 110 T 950 80 T 1100 60" class="drift-line" />

    <!-- Alert Points -->
    <circle cx="750" cy="110" r="8" fill="#f43f5e" class="alert-pulse" style="transform-origin: 750px 110px;" />
    <circle cx="950" cy="80" r="10" fill="#f43f5e" class="alert-pulse" style="transform-origin: 950px 80px;" />
    
    <!-- Grid accent points -->
    <circle cx="200" cy="150" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="400" cy="100" r="3" fill="#818cf8" opacity="0.5"/>
    <circle cx="600" cy="250" r="2" fill="#c084fc" opacity="0.6"/>
    <circle cx="850" cy="160" r="3" fill="#38bdf8" opacity="0.4"/>
  </g>

  <!-- Content Overlay (Foreground guarantees title readability) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="65" width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="120" y="86" class="tag" text-anchor="middle">MLOPS &amp; AI OBSERVABILITY</text>

    <!-- Main Title -->
    <text x="0" y="160" class="title">Awesome Model Drift Detection 📉🔍</text>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Curated ecosystem of SaaS &amp; Open-Source tools for Data, Concept &amp; Embedding Drift</text>
    
    <!-- Feature Pills -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">📊 Data Drift</text>

      <rect x="175" y="0" width="170" height="34" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="260" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">🧠 Concept Drift</text>

      <rect x="360" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="450" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">🔮 Embedding Drift</text>

      <rect x="555" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="645" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">⚡ Real-time Alerts</text>
    </g>
  </g>
</svg>
